# ═══════════════════════════════════════════════════════════════
# NGINX - Virtual Host Production (HTTPS)
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# HTTP → HTTPS Redirect
# ───────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name racine-by-ganda.com www.racine-by-ganda.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# ───────────────────────────────────────────────────────────────
# HTTPS Server
# ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name racine-by-ganda.com www.racine-by-ganda.com;
    root /var/www/html/public;
    index index.php index.html;

    # ───────────────────────────────────────────────────────────
    # SSL Configuration
    # ───────────────────────────────────────────────────────────
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

    # SSL Protocols & Ciphers (Mozilla Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ───────────────────────────────────────────────────────────
    # LOGGING
    # ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ───────────────────────────────────────────────────────────
    # RATE LIMITING
    # ───────────────────────────────────────────────────────────
    limit_req zone=general burst=20 nodelay;

    # ───────────────────────────────────────────────────────────
    # SECURITY
    # ───────────────────────────────────────────────────────────
    
    # Hide Nginx version
    server_tokens off;

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Disable access to sensitive files
    location ~* (\.env|\.git|\.gitignore|composer\.json|composer\.lock|package\.json|package-lock\.json|\.htaccess)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ───────────────────────────────────────────────────────────
    # STATIC FILES
    # ───────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ───────────────────────────────────────────────────────────
    # HEALTH CHECK
    # ───────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ───────────────────────────────────────────────────────────
    # API ENDPOINTS (Rate Limited)
    # ───────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ───────────────────────────────────────────────────────────
    # LOGIN ENDPOINTS (Strict Rate Limit)
    # ───────────────────────────────────────────────────────────
    location ~ ^/(login|register|password) {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ───────────────────────────────────────────────────────────
    # LARAVEL APPLICATION
    # ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ───────────────────────────────────────────────────────────
    # PHP-FPM
    # ───────────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI optimizations
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        # Security
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html:/tmp";
        fastcgi_param PHP_ADMIN_VALUE "upload_max_filesize=20M \n post_max_size=20M";
    }

    # ───────────────────────────────────────────────────────────
    # DENY ACCESS TO STORAGE
    # ───────────────────────────────────────────────────────────
    location ~ ^/storage/(.*)$ {
        deny all;
    }
}
