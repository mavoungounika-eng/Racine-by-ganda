# Docker Compose - Local Development (Sans DNS externe)
# Utilise des images locales ou pre-telechargees

services:

  # MySQL - Base de donnees
  mysql:
    image: mysql:8.0
    container_name: racine_mysql_local
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-racine_db}
      MYSQL_USER: ${DB_USERNAME:-racine_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}

    volumes:
      - mysql_data_local:/var/lib/mysql

    ports:
      - "3306:3306"

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache
  redis:
    image: redis:7-alpine
    container_name: racine_redis_local
    restart: unless-stopped

    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}

    volumes:
      - redis_data_local:/data

    ports:
      - "6379:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Laravel
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile

    container_name: racine_app_local
    restart: unless-stopped

    env_file:
      - .env.production.local

    volumes:
      - ./:/var/www/html

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "9000:9000"

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: racine_nginx_local
    restart: unless-stopped

    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      - app

volumes:
  mysql_data_local:
  redis_data_local:
