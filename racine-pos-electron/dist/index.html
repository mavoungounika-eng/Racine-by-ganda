<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CSP — durcissement du renderer Electron.

    ⚠️ Les tokens littéraux de la meta CSP ci-dessous (localhost:8000,
    HMR Vite, wildcard pusher.com) sont RÉÉCRITS au build par
    vite/plugins/cspTransform.js selon les variables d'env :
      VITE_API_URL, VITE_REVERB_HOST/PORT/SCHEME.
    Voir le fichier plugin pour le détail des substitutions.

    - 'self' : JS/CSS/images bundlés par Vite dans dist/
    - 'unsafe-inline' sur style-src : Vue 3 injecte des styles scoped
      inline (pas de contournement propre tant qu'on n'utilise pas de
      nonce côté Electron).
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: http://127.0.0.1:8000;
    font-src 'self' data:;
    connect-src 'self' http://127.0.0.1:8000 http://localhost:8080 ws://localhost:8080;
    frame-src 'none';
    object-src 'none';
    base-uri 'self';
  " />
  <title>Racine POS</title>
  <script type="module" crossorigin src="./assets/index-BKlPrjIC.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-PDGPwvUU.css">
</head>
<body>
  <div id="app"></div>
</body>
</html>
