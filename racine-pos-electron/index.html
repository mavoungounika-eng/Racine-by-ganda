<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Racine POS - Desktop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 500px;
      text-align: center;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 20px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .status {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 5px;
      text-align: left;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 13px;
    }
    .status-item .label {
      color: #666;
    }
    .status-item .value {
      font-weight: bold;
      color: #333;
    }
    .status-item.ok .value {
      color: #10b981;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #333;
    }
    .btn-secondary:hover {
      background: #d1d5db;
    }
    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🛒</div>
    <h1>Racine POS</h1>
    <p class="subtitle">Desktop Application v1.0</p>
    
    <div class="status">
      <div class="status-item ok">
        <span class="label">Backend Server:</span>
        <span class="value">✅ http://localhost:8000</span>
      </div>
      <div class="status-item ok">
        <span class="label">Database:</span>
        <span class="value">✅ MySQL Connected</span>
      </div>
      <div class="status-item ok">
        <span class="label">Electron:</span>
        <span class="value">✅ Running</span>
      </div>
      <div class="status-item ok">
        <span class="label">Status:</span>
        <span class="value">🟢 READY</span>
      </div>
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="goToDashboard()">📊 Go to Dashboard</button>
      <button class="btn-secondary" onclick="openDevTools()">🔧 Dev Tools</button>
    </div>

    <div class="footer">
      <p>Support: NIKA DIGITAL HUB | +242 06 832 52 86</p>
      <p>Build: 2026-01-28 | v1.0.0</p>
    </div>
  </div>

  <script>
    function goToDashboard() {
      window.location.href = 'http://localhost:8000/dashboard';
    }
    
    function openDevTools() {
      if (window.electronAPI) {
        console.log('Dev Tools available via DevTools shortcut (Ctrl+Shift+I)');
      }
    }

    console.log('🟢 POS Electron App Loaded');
    console.log('Backend: http://localhost:8000');
    console.log('Version: 1.0.0');
  </script>
</body>
</html>
