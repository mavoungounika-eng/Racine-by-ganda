<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CSP — on restreint au strict minimum nécessaire.
    - 'self' : JS/CSS/images bundlés par Vite dans dist/
    - http://127.0.0.1:8000 + http://localhost:8000 : backend Laravel (dev)
      Pour prod, remplacer manuellement par le domaine cible (racinebyganda.cm)
      ou générer dynamiquement au build via un petit plugin Vite.
    - ws://localhost:5173 : HMR Vite en dev, inerte en prod
    - https://*.pusher.com + wss://*.pusher.com : laravel-echo (temps réel)
    - 'unsafe-inline' sur style-src : Vue 3 injecte des styles scoped inline
      (pas de contournement propre tant qu'on n'utilise pas de nonce côté Electron)
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: http://127.0.0.1:8000 http://localhost:8000;
    font-src 'self' data:;
    connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 ws://localhost:5173 ws://127.0.0.1:5173 https://*.pusher.com wss://*.pusher.com;
    frame-src 'none';
    object-src 'none';
    base-uri 'self';
  " />
  <title>Racine POS</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
